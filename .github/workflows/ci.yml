name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME" || test -d "$ANDROID_SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Keep only the universal APK
        run: |
          mkdir -p single-apk
          APK="$(find app/build/outputs/apk/debug -type f -name '*universal*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Universal APK not found. Available APKs:"
            find app/build/outputs/apk/debug -type f -name '*.apk' -print
            exit 1
          fi
          cp "$APK" single-apk/Yakuyomi-Arabic.apk
          ls -lh single-apk/Yakuyomi-Arabic.apk

      - name: Upload one APK
        uses: actions/upload-artifact@v4
        with:
          name: Yakuyomi-Arabic
          path: single-apk/Yakuyomi-Arabic.apk
          if-no-files-found: error
          retention-days: 14
