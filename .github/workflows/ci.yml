name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME" || test -d "$ANDROID_SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.YAKUYOMI_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.YAKUYOMI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YAKUYOMI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/yakuyomi-release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=../yakuyomi-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$STORE_PASSWORD
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Keep only the universal APK
        run: |
          mkdir -p single-apk
          APK="$(find app/build/outputs/apk/release -type f -name '*universal*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Universal release APK not found. Available APKs:"
            find app/build/outputs/apk/release -type f -name '*.apk' -print
            exit 1
          fi
          cp "$APK" single-apk/Yakuyomi-Arabic-Signed.apk
          ls -lh single-apk/Yakuyomi-Arabic-Signed.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs single-apk/Yakuyomi-Arabic-Signed.apk

      - name: Upload one signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Yakuyomi-Arabic-Signed
          path: single-apk/Yakuyomi-Arabic-Signed.apk
          if-no-files-found: error
          retention-days: 14
