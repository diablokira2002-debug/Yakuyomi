name: Android OCR Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [arabic-v2]
    paths:
      - ".github/diagnostics/android-ocr/**"
      - ".github/workflows/android-ocr-diagnostic.yml"

jobs:
  chapter35:
    name: Chapter 35 OCR on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Chapter 35 OCR diagnostic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 6G
          script: |
            set +e
            chmod +x ./gradlew
            ./gradlew -p .github/diagnostics/android-ocr :app:connectedDebugAndroidTest --no-daemon --stacktrace
            TEST_STATUS=$?

            mkdir -p diagnostic-results
            REPORT_PATH="$(adb shell find /sdcard/Android/data/li.joye.yakuyomi.ocrdiagnostic/files -name yakuyomi-ocr-diagnostic.txt 2>/dev/null | tr -d '\r' | head -n 1)"
            if [ -n "$REPORT_PATH" ]; then
              adb pull "$REPORT_PATH" diagnostic-results/yakuyomi-ocr-diagnostic.txt || true
            fi
            adb logcat -d -s YakuyomiOcrDiag:I '*:S' > diagnostic-results/logcat.txt || true
            exit $TEST_STATUS

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chapter35-OCR-Diagnostic
          path: diagnostic-results/
          if-no-files-found: warn
          retention-days: 14
